<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PMD — Personal Management Dashboard</title>
<style>
:root{--bg:#fff;--surface:#fff;--soft:#f6f6f7;--line:#e9e9ec;--text:#111;--muted:#707078;--accent:#6366f1;--accentSoft:#eef0ff;--green:#16a34a;--amber:#d97706;--red:#dc2626;--blue:#3b82f6;--shadow:0 8px 28px rgba(0,0,0,.045)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
body.dark{--bg:#000;--surface:#111;--soft:#191919;--line:#292929;--text:#fff;--muted:#aaa;--accentSoft:#242442;--shadow:none}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;color:inherit;background:none}
.app{min-height:100vh}.top{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;background:var(--bg);z-index:5}
.brand{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:-.04em;font-size:19px}.brandmark{width:34px;height:34px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
.top-right{display:flex;align-items:center;gap:10px}.pillbtn,.iconbtn{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface)}.iconbtn{width:42px;height:42px;padding:0;display:grid;place-items:center}
.layout{display:flex;max-width:1500px;margin:auto}.side{width:245px;padding:24px 16px;border-right:1px solid var(--line);min-height:calc(100vh - 76px);position:sticky;top:76px;height:calc(100vh - 76px)}
.navlabel{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:14px 12px 8px;font-weight:700}
.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:13px;color:var(--muted);margin:3px 0;font-weight:550}
.nav.active{color:var(--accent);background:var(--accentSoft)}.nav .ico{width:21px;text-align:center;font-size:17px}
main{flex:1;min-width:0;padding:32px 38px 100px;max-width:1200px}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:26px}.eyebrow{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
h1{margin:5px 0 5px;font-size:32px;letter-spacing:-.045em}h2{font-size:18px;letter-spacing:-.02em;margin:0}h3{font-size:15px;margin:0}
.sub{color:var(--muted)}.primary{background:var(--accent);color:white;border-radius:12px;padding:12px 17px;font-weight:650}.secondary{border:1px solid var(--line);border-radius:12px;padding:11px 15px;background:var(--surface);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:25px}.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}.stat{font-size:29px;font-weight:750;letter-spacing:-.04em;margin:9px 0}.statlabel{color:var(--muted);font-size:13px}.staticon{width:38px;height:38px;border-radius:13px;background:var(--accentSoft);color:var(--accent);display:grid;place-items:center;font-size:18px}
.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.list{display:flex;flex-direction:column;gap:10px}.taskrow{display:flex;align-items:center;gap:12px;padding:13px 12px;border:1px solid var(--line);border-radius:15px}.check{width:21px;height:21px;border-radius:7px;border:1.5px solid #b6b6be;flex-shrink:0}.check.done{background:var(--green);border-color:var(--green);color:white;display:grid;place-items:center}.taskbody{flex:1;min-width:0}.tasktitle{font-weight:600}.taskmeta{color:var(--muted);font-size:12px;margin-top:3px}.badge{font-size:11px;padding:5px 8px;border-radius:9px;background:var(--soft);color:var(--muted);white-space:nowrap}.badge.red{color:var(--red);background:rgba(220,38,38,.09)}.badge.green{color:var(--green);background:rgba(22,163,74,.1)}.badge.amber{color:var(--amber);background:rgba(217,119,6,.1)}.badge.blue{color:var(--blue);background:rgba(59,130,246,.1)}
.project{border:1px solid var(--line);border-radius:17px;padding:16px}.progress{height:7px;background:var(--soft);border-radius:10px;overflow:hidden;margin:12px 0 8px}.progress>span{display:block;height:100%;background:var(--accent);border-radius:10px}.projectgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.projectmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.filters{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.filter{padding:9px 13px;border-radius:11px;border:1px solid var(--line);white-space:nowrap;color:var(--muted)}.filter.active{color:var(--accent);background:var(--accentSoft);border-color:transparent}.search{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;min-width:200px;color:var(--text)}
.calendargrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{min-height:90px;border:1px solid var(--line);border-radius:13px;padding:8px;font-size:12px}.day.today{border-color:var(--accent);background:var(--accentSoft)}.dayname{text-align:center;color:var(--muted);font-size:12px;padding:8px}.event{background:var(--accentSoft);color:var(--accent);border-radius:6px;padding:4px;margin-top:5px;overflow:hidden;font-size:10px}
.personrow{display:flex;align-items:center;gap:13px;padding:14px;border:1px solid var(--line);border-radius:16px}.avatar{width:44px;height:44px;border-radius:15px;background:var(--accentSoft);color:var(--accent);display:grid;place-items:center;font-weight:750}
.subject{padding:16px;border:1px solid var(--line);border-radius:16px}.moregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.module{border:1px solid var(--line);border-radius:18px;padding:19px;display:flex;gap:14px;align-items:flex-start;cursor:pointer}.module:hover,.taskrow:hover,.project:hover{border-color:var(--accent)}.moduleicon{width:44px;height:44px;border-radius:15px;background:var(--soft);display:grid;place-items:center;font-size:20px}
.mobilebar{display:none}.modalback{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modalback.show{display:flex}.modal{background:var(--surface);color:var(--text);width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:24px;padding:24px;border:1px solid var(--line)}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:650}.field input,.field textarea,.field select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px}.field textarea{min-height:85px}.modalactions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.hidden{display:none!important}.muted{color:var(--muted)}
@media(max-width:900px){.side{display:none}main{padding:24px 20px 100px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.top{padding:0 18px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--bg);border-top:1px solid var(--line);justify-content:space-around;padding:9px 6px calc(9px + env(safe-area-inset-bottom))}.mobilebar .nav{margin:0;padding:8px 5px;flex-direction:column;gap:3px;font-size:10px;flex:1;text-align:center}.mobilebar .ico{font-size:18px}.moregrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){h1{font-size:27px}.pagehead{flex-direction:column;align-items:stretch}.pagehead .primary{align-self:flex-start}.cards{gap:10px}.card{padding:14px}.projectgrid{grid-template-columns:1fr}.moregrid{grid-template-columns:1fr}.calendargrid{gap:3px}.day{min-height:63px;padding:4px}.day .event{display:none}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.search{width:100%}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="brandmark">P</div>PMD</div><div class="top-right"><button class="pillbtn" id="themeBtn">☾ Theme</button><button class="iconbtn" title="Add" onclick="openTask()">＋</button><div class="avatar" style="width:38px;height:38px">U</div></div></header>
<div class="layout">
<aside class="side">
<div class="navlabel">Workspace</div>
<div class="nav active" data-screen="home"><span class="ico">⌂</span>Home</div><div class="nav" data-screen="tasks"><span class="ico">☑</span>Tasks</div><div class="nav" data-screen="projects"><span class="ico">▣</span>Projects</div><div class="nav" data-screen="calendar"><span class="ico">▦</span>Calendar</div>
<div class="navlabel">Personal</div><div class="nav" data-screen="education"><span class="ico">⌘</span>Education</div><div class="nav" data-screen="people"><span class="ico">♙</span>People</div>
<div class="navlabel">More</div><div class="nav" data-screen="more"><span class="ico">⋯</span>More</div>
</aside>
<main id="main"></main>
</div>
<nav class="mobilebar"><div class="nav active" data-screen="home"><span class="ico">⌂</span>Home</div><div class="nav" data-screen="tasks"><span class="ico">☑</span>Tasks</div><div class="nav" data-screen="projects"><span class="ico">▣</span>Projects</div><div class="nav" data-screen="calendar"><span class="ico">▦</span>Calendar</div><div class="nav" data-screen="more"><span class="ico">⋯</span>More</div></nav>
</div>
<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h2 id="modalTitle">Create task</h2><button class="iconbtn" onclick="closeModal()">×</button></div><form id="form"><div id="formfields"></div><div class="modalactions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button class="primary" type="submit">Save</button></div></form></div></div>
<script>
const sampleTasks=[
{id:1,title:"Finish chapter review",status:"In Progress",priority:"High",due:"Today",project:"Exam preparation",area:"Education",subtasks:2},
{id:2,title:"Draft project proposal",status:"To Do",priority:"Medium",due:"Tomorrow",project:"Personal website",area:"Personal",subtasks:0},
{id:3,title:"Review weekly plan",status:"Waiting",priority:"Low",due:"Nov 20",project:"",area:"Personal",subtasks:0},
{id:4,title:"Complete physics assignment",status:"To Do",priority:"Urgent",due:"Today",project:"Exam preparation",area:"Education",subtasks:3},
{id:5,title:"Collect reference material",status:"Completed",priority:"Low",due:"Yesterday",project:"NASA project",area:"Projects",subtasks:0}
];
const sampleProjects=[{id:1,name:"Exam preparation",status:"Active",progress:42,next:"Physics test · Nov 22",people:1},{id:2,name:"Personal website",status:"Active",progress:65,next:"Review · Nov 25",people:2},{id:3,name:"NASA project",status:"On Hold",progress:30,next:"Research checkpoint",people:3},{id:4,name:"Learning roadmap",status:"Active",progress:20,next:"Java fundamentals",people:0}];
let tasks=sampleTasks,projects=sampleProjects,people=[{name:"Alex Morgan",relation:"Collaborator",birthday:"Nov 24",notes:"Design review partner",tasks:1,projects:1},{name:"Jamie Lee",relation:"Friend",birthday:"Dec 3",notes:"",tasks:0,projects:1}],screen="home",filter="All",monthOffset=0;
const main=document.getElementById("main");
function setScreen(s){screen=s;document.querySelectorAll(".nav[data-screen]").forEach(x=>x.classList.toggle("active",x.dataset.screen===s));render()}
document.querySelectorAll(".nav[data-screen]").forEach(x=>x.addEventListener("click",()=>setScreen(x.dataset.screen)));
document.getElementById("themeBtn").onclick=()=>{document.body.classList.toggle("dark");document.getElementById("themeBtn").textContent=document.body.classList.contains("dark")?"☀ Light":"☾ Theme"};
function header(title,desc,button=""){return `<div class="pagehead"><div><div class="eyebrow">Personal Management</div><h1>${title}</h1><div class="sub">${desc}</div></div>${button}</div>`}
function taskRow(t){return `<div class="taskrow"><button class="check ${t.status==="Completed"?"done":""}" onclick="toggleTask(${t.id})">${t.status==="Completed"?"✓":""}</button><div class="taskbody"><div class="tasktitle" ${t.status==="Completed"?'style="text-decoration:line-through;opacity:.6"':''}>${esc(t.title)}</div><div class="taskmeta">${t.project?esc(t.project)+" · ":""}${t.due||"No date"}${t.subtasks?` · ${t.subtasks} subtasks`:""}</div></div><span class="badge ${t.priority==="Urgent"?"red":t.priority==="High"?"amber":""}">${t.priority}</span><button class="iconbtn" style="width:34px;height:34px" onclick="editTask(${t.id})">✎</button></div>`}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){if(screen==="home")home();if(screen==="tasks")tasksScreen();if(screen==="projects")projectsScreen();if(screen==="calendar")calendarScreen();if(screen==="education")educationScreen();if(screen==="people")peopleScreen();if(screen==="more")moreScreen()}
function home(){main.innerHTML=header("Good day.","Your space, in focus.",`<button class="primary" onclick="openTask()">＋ New task</button>`)+`<div class="cards"><div class="card"><div class="staticon">◉</div><div class="stat">${tasks.filter(t=>t.status!=="Completed").length}</div><div class="statlabel">Open tasks</div></div><div class="card"><div class="staticon">◷</div><div class="stat">${tasks.filter(t=>t.due==="Today"&&t.status!=="Completed").length}</div><div class="statlabel">Due today</div></div><div class="card"><div class="staticon">▣</div><div class="stat">${projects.filter(p=>p.status==="Active").length}</div><div class="statlabel">Active projects</div></div><div class="card"><div class="staticon">↗</div><div class="stat">${tasks.filter(t=>t.status==="Completed").length}</div><div class="statlabel">Completed tasks</div></div></div><div class="grid2"><div class="card"><div class="sectionhead"><h2>Today, in motion</h2><button class="secondary" onclick="setScreen('tasks')">All tasks</button></div><div class="list">${tasks.filter(t=>t.due==="Today"&&t.status!=="Completed").map(taskRow).join("")||`<div class="muted">Nothing scheduled for today.</div>`}</div></div><div class="card"><div class="sectionhead"><h2>Project pulse</h2><button class="secondary" onclick="setScreen('projects')">View projects</button></div><div class="list">${projects.filter(p=>p.status==="Active").slice(0,3).map(p=>`<div class="project"><div class="sectionhead"><h3>${esc(p.name)}</h3><span class="badge blue">${p.progress}%</span></div><div class="progress"><span style="width:${p.progress}%"></span></div><div class="projectmeta"><span>${esc(p.next)}</span></div></div>`).join("")}</div></div></div><div class="card" style="margin-top:16px"><div class="sectionhead"><h2>Coming up</h2><button class="secondary" onclick="setScreen('calendar')">Calendar</button></div><div class="list">${tasks.filter(t=>t.status!=="Completed").slice(0,3).map(taskRow).join("")}</div></div>`}
function tasksScreen(){let list=tasks.filter(t=>filter==="All"||(filter==="Open"&&t.status!=="Completed")||t.status===filter);main.innerHTML=header("Tasks","A clear list of what needs your attention.",`<button class="primary" onclick="openTask()">＋ Create task</button>`)+`<div class="filters">${["All","Open","Today","In Progress","Waiting","Blocked","Completed"].map(f=>`<button class="filter ${filter===f?"active":""}" onclick="filter='${f}';render()">${f}</button>`).join("")}</div><div class="sectionhead"><input class="search" placeholder="⌕ Search tasks" oninput="searchTasks(this.value)"><span class="muted">${list.length} items</span></div><div id="tasklist" class="list">${list.map(taskRow).join("")}</div>`}
function searchTasks(q){document.getElementById("tasklist").innerHTML=tasks.filter(t=>t.title.toLowerCase().includes(q.toLowerCase())).map(taskRow).join("")}
function toggleTask(id){let t=tasks.find(x=>x.id===id);t.status=t.status==="Completed"?"To Do":"Completed";render()}
function editTask(id){let t=tasks.find(x=>x.id===id);openTask(t)}
function projectsScreen(){main.innerHTML=header("Projects","Work organized around outcomes.",`<button class="primary" onclick="openProject()">＋ New project</button>`)+`<div class="filters">${["All","Active","On Hold","Completed","Archived"].map(f=>`<button class="filter ${filter===f?"active":""}" onclick="filter='${f}';render()">${f}</button>`).join("")}</div><div class="projectgrid">${projects.filter(p=>filter==="All"||p.status===filter).map(p=>`<div class="project"><div class="sectionhead"><h3>${esc(p.name)}</h3><button class="iconbtn" onclick="editProject(${p.id})">✎</button></div><span class="badge ${p.status==="Active"?"blue":""}">${p.status}</span><div class="progress"><span style="width:${p.progress}%"></span></div><div class="projectmeta"><span>${p.progress}% complete</span><span>${p.people} linked</span></div><div class="taskmeta" style="margin-top:12px">Next: ${esc(p.next)}</div><button class="secondary" style="width:100%;margin-top:12px" onclick="projectDetail(${p.id})">Open workspace →</button></div>`).join("")}</div>`}
function editProject(id){openProject(projects.find(p=>p.id===id))}
function projectDetail(id){let p=projects.find(p=>p.id===id);main.innerHTML=header(p.name,`Project workspace · ${p.status}`,`<button class="secondary" onclick="editProject(${id})">✎ Edit project</button>`)+`<div class="cards"><div class="card"><div class="stat">${p.progress}%</div><div class="statlabel">Progress</div></div><div class="card"><div class="stat">${p.people}</div><div class="statlabel">Linked people</div></div><div class="card"><div class="stat">${tasks.filter(t=>t.project===p.name).length}</div><div class="statlabel">Linked tasks</div></div><div class="card"><div class="stat">${p.status}</div><div class="statlabel">Status</div></div></div><div class="grid2"><div class="card"><div class="sectionhead"><h2>Project tasks</h2><button class="primary" onclick="openTask(null,'${esc(p.name)}')">＋ Add task</button></div><div class="list">${tasks.filter(t=>t.project===p.name).map(taskRow).join("")||`<div class="muted">No tasks linked.</div>`}</div></div><div class="card"><h2>Milestones & next</h2><p>${esc(p.next)}</p><div class="sectionhead" style="margin-top:25px"><h2>People</h2><button class="secondary" onclick="setScreen('people')">Manage</button></div><p class="muted">${p.people} linked people</p></div></div>`}
function calendarScreen(){let now=new Date();let m=new Date(now.getFullYear(),now.getMonth()+monthOffset,1);let days=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();let start=m.getDay();let cells=[];for(let i=0;i<start;i++)cells.push(`<div class="day" style="opacity:.25"></div>`);for(let d=1;d<=days;d++){let today=monthOffset===0&&d===now.getDate();cells.push(`<div class="day ${today?"today":""}"><b>${d}</b>${d===now.getDate()?`<div class="event">Today</div>`:""}</div>`)}main.innerHTML=header("Calendar","Your time, across the month.",`<button class="primary" onclick="openTask()">＋ Add</button>`)+`<div class="card"><div class="sectionhead"><h2>${m.toLocaleString('default',{month:'long',year:'numeric'})}</h2><div><button class="secondary" onclick="monthOffset--;render()">←</button> <button class="secondary" onclick="monthOffset=0;render()">Today</button> <button class="secondary" onclick="monthOffset++;render()">→</button></div></div><div class="calendargrid">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="dayname">${x}</div>`).join("")}${cells.join("")}</div></div><div class="card" style="margin-top:16px"><h2>Upcoming</h2><div class="list" style="margin-top:14px">${tasks.filter(t=>t.status!=="Completed").map(taskRow).join("")}</div></div>`}
function educationScreen(){main.innerHTML=header("Education","Your academic life, in one workspace.",`<button class="primary" onclick="openTask(null,'','Education')">＋ Study task</button>`)+`<div class="cards"><div class="card"><div class="stat">${tasks.filter(t=>t.area==="Education"&&t.status!=="Completed").length}</div><div class="statlabel">Study tasks</div></div><div class="card"><div class="stat">—</div><div class="statlabel">Upcoming exams</div></div><div class="card"><div class="stat">—</div><div class="statlabel">Subjects</div></div><div class="card"><div class="stat">—</div><div class="statlabel">Study sessions</div></div></div><div class="moregrid">${["Subjects & Topics","Assignments","Exams & Calendar","Notes","Resources","Study Sessions","Progress & Goals","Academic Archive"].map((n,i)=>`<div class="module" onclick="educationStub('${n}')"><div class="moduleicon">${["▤","☑","▦","✎","▧","◷","↗","▣"][i]}</div><div><h3>${n}</h3><div class="taskmeta">Organize and track ${n.toLowerCase()}</div></div></div>`).join("")}</div><div class="card" style="margin-top:16px"><h2>Academic tasks</h2><div class="list" style="margin-top:14px">${tasks.filter(t=>t.area==="Education").map(taskRow).join("")||`<div class="muted">No academic tasks yet. Create your first study task.</div>`}</div></div>`}
function educationStub(n){main.innerHTML=header(n,"Education workspace",`<button class="primary" onclick="openTask(null,'','Education')">＋ Add</button>`)+`<div class="card"><h2>${n}</h2><p class="muted">This new prototype includes the screen structure. Detailed storage and workflows for this section are planned for implementation.</p><button class="secondary" onclick="setScreen('education')">← Education overview</button></div>`}
function peopleScreen(){main.innerHTML=header("People","Information, connections and shared work.",`<button class="primary" onclick="openPerson()">＋ Add person</button>`)+`<div class="list">${people.map((p,i)=>`<div class="personrow"><div class="avatar">${esc(p.name.split(" ").map(x=>x[0]).join(""))}</div><div class="taskbody"><h3>${esc(p.name)}</h3><div class="taskmeta">${esc(p.relation)} · ${p.birthday||"No date"}</div></div><button class="secondary" onclick="personDetail(${i})">View</button><button class="iconbtn" onclick="openPerson(${i})">✎</button></div>`).join("")}</div>`}
function personDetail(i){let p=people[i];main.innerHTML=header(p.name,p.relation,`<button class="secondary" onclick="openPerson(${i})">✎ Edit</button>`)+`<div class="grid2"><div class="card"><h2>Information</h2><p><b>Birthday:</b> ${p.birthday||"—"}</p><p><b>Relationship:</b> ${p.relation}</p><p><b>Notes:</b> ${p.notes||"—"}</p></div><div class="card"><h2>Connections</h2><p>${p.projects} linked project(s)</p><p>${p.tasks} linked task(s)</p><button class="primary" onclick="openTask()">＋ Link task</button></div></div><div class="card" style="margin-top:16px"><h2>Linked projects & tasks</h2><p class="muted">Relationship management is represented in this prototype; detailed persistence and link editing will be implemented.</p></div>`}
function moreScreen(){main.innerHTML=header("More","Modules and settings.")+`<div class="navlabel">AI & Reviews</div><div class="moregrid">${moduleCard("Lavi","AI assistant","✦","AI assistance, planning and chat")}${moduleCard("AI Updates","Suggestions & insights","↗","Review proposed changes")}${moduleCard("Project Review","Project analysis","▣","Review progress and risks")}</div><div class="navlabel">Personal</div><div class="moregrid">${moduleCard("Education","Student workspace","⌘","Academic life and study")}${moduleCard("People & Birthdays","People records","♙","Information and connections")}${moduleCard("Hidden Folder","Private workspace","◈","Private notes and records")}</div><div class="navlabel">System</div><div class="moregrid">${moduleCard("Settings","Preferences","⚙","Appearance and configuration")}${moduleCard("Privacy & Security","Protection","◉","Permissions and privacy")}${moduleCard("Data & Backup","Data lifecycle","▤","Import, export and backup")}${moduleCard("Help","Guidance","?","User guide and help")}</div>`}
function moduleCard(title,desc,ico,sub){return `<div class="module" onclick="moduleStub('${title}')"><div class="moduleicon">${ico}</div><div><h3>${title}</h3><div class="taskmeta">${sub}</div></div></div>`}
function moduleStub(n){main.innerHTML=header(n,"New screen structure",`<button class="secondary" onclick="setScreen('more')">← More</button>`)+`<div class="card"><h2>${n}</h2><p class="muted">This screen is part of the new PMD prototype. Its visual structure is included, while deeper functionality is scheduled for the relevant development phase.</p></div>`}
function openTask(t=null,project="",area=""){document.getElementById("modalTitle").textContent=t?"Edit task":"Create task";document.getElementById("formfields").innerHTML=`<div class="formgrid"><div class="field full"><label>Task title *</label><input name="title" required value="${esc(t?.title||"")}" placeholder="What needs to get done?"></div><div class="field"><label>Status</label><select name="status">${["Backlog","To Do","In Progress","Waiting","Blocked","Completed","Cancelled"].map(x=>`<option ${t?.status===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Priority</label><select name="priority">${["Urgent","High","Medium","Low"].map(x=>`<option ${t?.priority===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Due date / label</label><input name="due" value="${esc(t?.due||"")}" placeholder="Today, date, etc."></div><div class="field"><label>Project</label><select name="project"><option value="">None</option>${projects.map(p=>`<option ${((t?.project||project)===p.name)?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div><div class="field"><label>Life area</label><select name="area"><option>Personal</option><option ${((t?.area||area)==="Education"?"selected":"")}>Education</option><option>Work</option><option>Projects</option></select></div><div class="field"><label>Subtasks (count)</label><input name="subtasks" type="number" min="0" value="${t?.subtasks||0}"></div></div>`;document.getElementById("form").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);let data={title:f.get("title"),status:f.get("status"),priority:f.get("priority"),due:f.get("due"),project:f.get("project"),area:f.get("area"),subtasks:+f.get("subtasks")};if(t)Object.assign(t,data);else tasks.unshift({...data,id:Date.now()});closeModal();render()};showModal()}
function openProject(p=null){document.getElementById("modalTitle").textContent=p?"Edit project":"Create project";document.getElementById("formfields").innerHTML=`<div class="formgrid"><div class="field full"><label>Project name *</label><input name="name" required value="${esc(p?.name||"")}"></div><div class="field"><label>Status</label><select name="status">${["Active","On Hold","Completed","Archived"].map(x=>`<option ${p?.status===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Progress (%)</label><input name="progress" type="number" min="0" max="100" value="${p?.progress||0}"></div><div class="field full"><label>Next milestone / note</label><input name="next" value="${esc(p?.next||"")}"></div><div class="field"><label>Linked people count</label><input name="people" type="number" min="0" value="${p?.people||0}"></div></div>`;document.getElementById("form").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);let data={name:f.get("name"),status:f.get("status"),progress:+f.get("progress"),next:f.get("next"),people:+f.get("people")};if(p)Object.assign(p,data);else projects.push({...data,id:Date.now()});closeModal();render()};showModal()}
function openPerson(i=null){let p=i===null?null:people[i];document.getElementById("modalTitle").textContent=p?"Edit person":"Add person";document.getElementById("formfields").innerHTML=`<div class="formgrid"><div class="field full"><label>Name *</label><input name="name" required value="${esc(p?.name||"")}"></div><div class="field"><label>Relationship</label><input name="relation" value="${esc(p?.relation||"")}"></div><div class="field"><label>Birthday</label><input name="birthday" value="${esc(p?.birthday||"")}"></div><div class="field full"><label>Information / notes</label><textarea name="notes">${esc(p?.notes||"")}</textarea></div></div>`;document.getElementById("form").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),d={name:f.get("name"),relation:f.get("relation"),birthday:f.get("birthday"),notes:f.get("notes"),tasks:p?.tasks||0,projects:p?.projects||0};if(p)Object.assign(p,d);else people.push(d);closeModal();render()};showModal()}
function showModal(){document.getElementById("modalback").classList.add("show")}function closeModal(){document.getElementById("modalback").classList.remove("show")}
render();
</script>
</body></html>
